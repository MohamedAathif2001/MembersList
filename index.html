<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Member Directory</title>
<style>
body { font-family: Arial; max-width:800px; margin:auto; padding:20px; }
h2 { border-bottom:1px solid #ddd; padding-top:20px; margin-top:30px; }
.row { display:flex; gap:10px; padding:4px 0; }
.no { width:50px; font-weight:bold; }
.pos { color:#666; }
</style>
</head>
<body>

<h1>Member Directory</h1>
<div id="content">Loading...</div>

<script>
fetch("/api/members")
.then(r => r.json())
.then(data => {
  const groups = {};
  data.forEach(m => {
    if(!groups[m.Category]) groups[m.Category] = [];
    groups[m.Category].push(m);
  });

  const container = document.getElementById("content");
  container.innerHTML = "";

  for (const cat in groups) {
    const h = document.createElement("h2");
    h.textContent = cat;
    container.appendChild(h);

    groups[cat]
      .sort((a,b) => a.No - b.No)
      .forEach(m => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML =
          `<div class="no">${m.No}</div>
           <div>${m.Name}</div>
           <div class="pos">${m.Position||""}</div>`;
        container.appendChild(row);
      });
  }
})
.catch(err => {
  document.getElementById("content").innerText = "Failed to load members.";
});
</script>

</body>
</html>
